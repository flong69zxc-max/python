name: Run Python Script

on:
  push:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      # Устанавливаем squashfs-tools (это основное, что нужно скрипту)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      
      # Запускаем твой скрипт
      - name: Run repack script
        run: |
          python3 build_transition_full_repack.py firmware.bin -o mts.bin
      
      # Сохраняем результат
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mts-output
          path: mts.bin
