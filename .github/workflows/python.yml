name: Build Transition Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # принудительный таймаут, чтобы не висеть 22 минуты

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools python3

      - name: Build firmware
        run: |
          chmod +x build_transition_full_repack.py
          # Запускаем с замером времени и выводом прогресса
          time ./build_transition_full_repack.py firmware.bin -o transition.bin

      - name: Upload artifact
        if: always()   # загружаем даже если сборка упала (для отладки)
        uses: actions/upload-artifact@v4
        with:
          name: DIR-842R7-Transition
          path: transition.bin
          if-no-files-found: warn
