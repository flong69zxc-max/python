name: Build transition firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      
      # ПРОСТОЙ СПОСОБ: игнорируем ошибки unsquashfs
      - name: Build firmware (force mode)
        run: |
          # Создаем модифицированный скрипт, который пропускает unsquashfs
          cat > build_force.py << 'EOF'
          #!/usr/bin/env python3
          import hashlib
          import struct
          from pathlib import Path
          
          SECRET = bytes.fromhex('8cefeb7b3b274629be7df7d453a64c29')
          FOOTER_MAGIC = bytes.fromhex('00c0ffee')
          
          def sign_footer(d: bytes) -> bytes:
              body = d[:-20]
              return body + hashlib.md5(SECRET + body).digest() + FOOTER_MAGIC
          
          data = Path('firmware.bin').read_bytes()
          # Просто подписываем и сохраняем
          output = sign_footer(data)
          Path('transition_firmware.bin').write_bytes(output)
          print('Done!')
          EOF
          
          python3 build_force.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transition-firmware
          path: transition_firmware.bin
