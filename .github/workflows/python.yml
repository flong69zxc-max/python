name: Build transition firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Собираем свежий squashfs-tools из исходников
      - name: Build squashfs-tools from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblzma-dev liblzo2-dev zlib1g-dev
          git clone https://github.com/plougher/squashfs-tools.git
          cd squashfs-tools/squashfs-tools
          make
          sudo make install
          unsquashfs -version
      
      - name: Build transition firmware
        run: |
          python3 build_transition_full_repack.py firmware.bin -o transition_firmware.bin
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transition-firmware
          path: transition_firmware.bin
